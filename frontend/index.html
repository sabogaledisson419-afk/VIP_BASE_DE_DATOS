<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Vehículo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-wrapper">
    
    <!-- Barra Superior de Control de Acceso -->
    <header class="top-bar">
      <div id="admin-status-text">Modo: <strong>Usuario (Solo Registro)</strong></div>
      <button id="auth-btn" class="auth-btn">Acceso Administrador</button>
    </header>

    <!-- Tarjeta del Formulario -->
    <div class="card-container">
      <div class="card-header">
        <h2>Registro de Vehículo</h2>
        <p>Ingresa la información requerida a continuación</p>
      </div>

      <form id="vehicle-form" class="vehicle-form">
        
        <div class="form-group">
          <label for="placa">Placa del Vehículo</label>
          <input 
            type="text" 
            id="placa" 
            name="placa" 
            placeholder="Ej. ABC-123" 
            maxlength="7" 
            required 
            style="text-transform: uppercase;">
        </div>

        <div class="form-group">
          <label for="conductor">Nombre del Conductor</label>
          <input 
            type="text" 
            id="conductor" 
            name="conductor" 
            placeholder="Nombre y Apellidos" 
            required>
        </div>

        <div class="form-group">
          <label for="telefono">Número Telefónico</label>
          <input 
            type="tel" 
            id="telefono" 
            name="telefono" 
            placeholder="Ej. 3001234567" 
            pattern="[0-9]{7,10}"
            title="Ingresa un número telefónico válido (entre 7 y 10 dígitos)"
            required>
        </div>

        <div class="form-group">
          <label for="fecha-soat">Fecha de Vencimiento SOAT</label>
          <input 
            type="date" 
            id="fecha-soat" 
            name="fecha_soat" 
            required>
        </div>

        <div class="form-group">
          <label for="foto">Foto del Vehículo</label>
          <div class="file-upload-box">
            <input 
              type="file" 
              id="foto" 
              name="foto_vehiculo" 
              accept="image/*" 
              required>
            <div class="upload-label">
              <span class="upload-icon">📷</span>
              <p>Haz clic o arrastra una imagen aquí</p>
            </div>
            <img id="image-preview" src="#" alt="Previsualización de la foto">
          </div>
        </div>

        <button type="submit" class="submit-btn">Guardar Registro</button>

      </form>
    </div>

    <!-- Tabla para Administrador -->
    <div id="table-container" class="table-container hidden">
      <div class="table-header">
        <h3>Vehículos Registrados (Vista Administrador)</h3>
      </div>
      
      <div class="table-responsive">
        <table id="records-table">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Placa</th>
              <th>Conductor</th>
              <th>Teléfono</th>
              <th>Vencimiento SOAT</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="table-body">
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
